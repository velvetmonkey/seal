# SPDX-License-Identifier: Apache-2.0
name: macOS build evidence

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos-install-demo-receipt:
    name: ${{ matrix.platform }} install, demo, Protect helper, and receipt check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            wrong_arch: x86_64
            wrong_platform: darwin-x64
          - platform: darwin-x64
            runner: macos-15-intel
            wrong_arch: arm64
            wrong_platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and tamper-test the macOS process-start witness helper
        shell: bash
        run: |
          set -euo pipefail
          test "darwin-$(node -p 'process.arch')" = "${{ matrix.platform }}"
          cc -Wall -Wextra -Werror runtime/macos-process-start-witness.c -o "$RUNNER_TEMP/macos-process-start-witness"
          node scripts/macos-helper.cjs --helper "$RUNNER_TEMP/macos-process-start-witness" --platform "${{ matrix.platform }}"
          cp "$RUNNER_TEMP/macos-process-start-witness" runtime/macos-process-start-witness
          node scripts/macos-process-witness-evidence.cjs | tee "$RUNNER_TEMP/macos-process-witness.log"
      - name: Refuse a deliberately wrong-architecture helper
        shell: bash
        run: |
          set -euo pipefail
          wrong="$RUNNER_TEMP/macos-process-start-witness-wrong"
          cc -arch "${{ matrix.wrong_arch }}" -Wall -Wextra -Werror runtime/macos-process-start-witness.c -o "$wrong"
          set +e
          output="$(node scripts/macos-helper.cjs --helper "$wrong" --platform "${{ matrix.platform }}" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output" | tee "$RUNNER_TEMP/wrong-architecture.log"
          test "$status" -eq 1
          test "$output" = "REFUSE macos_helper_architecture: expected ${{ matrix.platform }} helper, got ${{ matrix.wrong_platform }}"
      - name: Build and run the documented macOS install ritual
        shell: bash
        run: |
          set -euo pipefail
          platform="${{ matrix.platform }}"
          dist="$RUNNER_TEMP/macos-dist"
          prefix="$RUNNER_TEMP/macos-prefix"
          node scripts/build-dist.cjs --platform "$platform" --macos-helper "$RUNNER_TEMP/macos-process-start-witness" --out "$dist"
          read -r expected_digest expected_bytes expected_name < "$dist/SHA256SUMS"
          expected_stem="$(node scripts/product-identity.cjs --artifact-name | sed 's/-linux-x64$//')"
          test "$expected_name" = "$expected_stem-$platform"
          if command -v shasum >/dev/null 2>&1; then
            digest_tool='shasum -a 256'
            actual_digest="$(shasum -a 256 "$dist/$expected_name" | awk '{print $1}')"
          elif command -v sha256sum >/dev/null 2>&1; then
            digest_tool=sha256sum
            actual_digest="$(sha256sum "$dist/$expected_name" | awk '{print $1}')"
          else
            echo '::error::no SHA-256 tool found (need shasum or sha256sum)'
            exit 1
          fi
          echo "digest-tool $digest_tool"
          test "$actual_digest" = "$expected_digest"
          actual_bytes="$(wc -c < "$dist/$expected_name" | tr -d ' ')"
          test "$actual_bytes" = "$expected_bytes"
          chmod +x "$dist/$expected_name"
          set +e
          "$dist/$expected_name" --sha256 "$expected_digest" --bytes "$expected_bytes" --prefix "$prefix" > "$RUNNER_TEMP/macos-install.log" 2>&1
          install_status=$?
          set -e
          cat "$RUNNER_TEMP/macos-install.log"
          echo "macos-install-exit $install_status"
          test "$install_status" -eq 0
      - name: Run seal demo and record its exit
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/macos-prefix"
          demo_dir="$RUNNER_TEMP/macos-demo"
          printf 'y\n' > "$RUNNER_TEMP/demo-input"
          set +e
          "$prefix/bin/seal" demo --dir "$demo_dir" < "$RUNNER_TEMP/demo-input" > "$RUNNER_TEMP/macos-demo.log" 2>&1
          demo_status=$?
          set -e
          cat "$RUNNER_TEMP/macos-demo.log"
          echo "macos-demo-exit $demo_status"
          test "$demo_status" -eq 0
      - name: Check a receipt produced by that demo
        shell: bash
        run: |
          set -euo pipefail
          receipt="$(find "$RUNNER_TEMP/macos-demo/receipts" -type f -name '*-ALLOW.json' -print -quit)"
          test -n "$receipt"
          prefix="$RUNNER_TEMP/macos-prefix"
          store="$prefix/lib/seal/store/$(node -p "require('$prefix/lib/seal/install.json').treeSha256")"
          # checker/seal-receipt-v2.mjs runs here with its installed runtime sibling.
          checker="$store/checker/seal-receipt-v2.mjs"
          public_key="$(tr -d '\n' < "$RUNNER_TEMP/macos-demo/receipt-signer.pub")"
          set +e
          node "$checker" "$receipt" --pubkey "$public_key" > "$RUNNER_TEMP/macos-receipt-check.log" 2>&1
          checker_status=$?
          set -e
          cat "$RUNNER_TEMP/macos-receipt-check.log"
          echo "macos-receipt-check-exit $checker_status"
          test "$checker_status" -eq 0
      - name: "Negative control: Linux artifact refuses on macOS without writing bytes"
        shell: bash
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/linux-dist"
          prefix="$RUNNER_TEMP/linux-on-darwin-prefix"
          mkdir -p "$prefix"
          node scripts/build-dist.cjs --platform linux-x64 --out "$dist"
          read -r digest bytes artifact < "$dist/SHA256SUMS"
          find "$prefix" -type f -exec shasum -a 256 {} \; | LC_ALL=C sort > "$RUNNER_TEMP/linux-on-darwin.before"
          set +e
          "$dist/$artifact" --sha256 "$digest" --bytes "$bytes" --prefix "$prefix" > "$RUNNER_TEMP/linux-on-darwin.log" 2>&1
          mismatch_status=$?
          set -e
          cat "$RUNNER_TEMP/linux-on-darwin.log"
          echo "linux-on-darwin-exit $mismatch_status"
          test "$mismatch_status" -eq 1
          grep -E '^REFUSE unsupported_platform: artifact platform is linux-x64, running host is darwin-(x64|arm64)$' "$RUNNER_TEMP/linux-on-darwin.log"
          find "$prefix" -type f -exec shasum -a 256 {} \; | LC_ALL=C sort > "$RUNNER_TEMP/linux-on-darwin.after"
          cmp "$RUNNER_TEMP/linux-on-darwin.before" "$RUNNER_TEMP/linux-on-darwin.after"
      - name: Upload macOS execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-evidence-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/macos-dist/seal-v*-darwin-*
            ${{ runner.temp }}/macos-dist/SHA256SUMS
          if-no-files-found: warn

  darwin-x64-kernel-timing-instrument:
    name: darwin-x64 kernel authorization timing instrument (temporary until 2026-09-11)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure repeated kernel decisions on Intel macOS
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { createKernelAuthorizationAdapter } = require("./contract/kernel-authorization.cjs");
          const adapter = createKernelAuthorizationAdapter();
          const input = {
            epoch: 1,
            issuedTool: "demo.mutate",
            issuedArgs: { line: "darwin timing instrument" },
            retryTool: "demo.mutate",
            retryArgs: { line: "darwin timing instrument" },
            accepted: true,
            now: 1000,
          };
          for (let sample = 1; sample <= 40; sample += 1) {
            const answer = adapter.authorize(input);
            console.log(JSON.stringify({ sample, kernel_timing_ms: answer.kernel_timing_ms }));
          }
          NODE
      - name: Negative control: delayed decision still refuses closed
        shell: bash
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/delay-kernel-decision.cjs"
          cat > "$control" <<'NODE'
          const Module = require("node:module");
          const originalLoad = Module._load;
          Module._load = function(request, parent, isMain) {
            const loaded = originalLoad.apply(this, arguments);
            if (request.endsWith("runner.cjs")) {
              const decide = loaded.decide;
              loaded.decide = async (...args) => {
                await new Promise((resolve) => setTimeout(resolve, 5100));
                return decide(...args);
              };
            }
            return loaded;
          };
          NODE
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const { createKernelAuthorizationAdapter, KernelAuthorizationError } = require("./contract/kernel-authorization.cjs");
          process.env.NODE_OPTIONS = `--require=${process.env.RUNNER_TEMP}/delay-kernel-decision.cjs`;
          try {
            createKernelAuthorizationAdapter().authorize({
              epoch: 1, issuedTool: "demo.mutate", issuedArgs: { line: "negative control" },
              retryTool: "demo.mutate", retryArgs: { line: "negative control" }, accepted: true, now: 1000,
            });
            assert.fail("expected kernel deadline refusal");
          } catch (error) {
            assert.ok(error instanceof KernelAuthorizationError);
            assert.equal(error.code, "kernel_execution_refused");
            console.log(`negative-control-refusal ${error.code}: ${error.message}`);
          }
          NODE

  linux-build-evidence:
    name: linux-x64 build evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Linux artifact and checksum declaration
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-dist.cjs --platform linux-x64 --out "$RUNNER_TEMP/linux-dist"
      - name: Upload Linux artifact and checksum declaration
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-evidence-linux-x64
          path: |
            ${{ runner.temp }}/linux-dist/seal-v*-linux-x64
            ${{ runner.temp }}/linux-dist/SHA256SUMS
          if-no-files-found: error

  release-matrix-evidence:
    name: Three-artifact checksum evidence
    needs:
      - macos-install-demo-receipt
      - linux-build-evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-build-evidence-darwin-*
          path: ${{ runner.temp }}/macos
      - uses: actions/download-artifact@v4
        with:
          name: linux-build-evidence-linux-x64
          path: ${{ runner.temp }}/linux
      - name: Verify three distinct artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' sums_files < <(find "$RUNNER_TEMP/macos" "$RUNNER_TEMP/linux" -type f -name SHA256SUMS -print0 | sort -z)
          : > "$RUNNER_TEMP/SHA256SUMS"
          for sums in "${sums_files[@]}"; do
            cat "$sums" >> "$RUNNER_TEMP/SHA256SUMS"
          done
          line_count="$(wc -l < "$RUNNER_TEMP/SHA256SUMS")"
          unique_count="$(awk '{ print $1 }' "$RUNNER_TEMP/SHA256SUMS" | sort -u | wc -l)"
          test "$line_count" -eq 3
          test "$unique_count" -eq 3
          for sums in "${sums_files[@]}"; do
            (cd "$(dirname "$sums")" && awk '{ print $1 "  " $3 }' SHA256SUMS | sha256sum -c -)
          done
