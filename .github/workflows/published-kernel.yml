# SPDX-License-Identifier: Apache-2.0
name: SAME-AUTHORITY LINUX-X64 ARTIFACT KERNEL CORRESPONDENCE

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to inspect
        required: true
        default: v0.2.0-rc.3
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  same-authority-post-release-reproduction:
    name: SAME-AUTHORITY LINUX-X64 ARTIFACT KERNEL CORRESPONDENCE
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild the kernel from its tag-pinned Lean source
        shell: bash
        run: |
          set -euo pipefail
          pin="$(node - "$RELEASE_TAG" <<'NODE'
          const { SOURCE_PINS } = require('./scripts/seal-reproduce.cjs');
          const pin = SOURCE_PINS[process.argv[2]];
          if (!pin) process.exit(1);
          process.stdout.write(`${pin.repository} ${pin.commit}`);
          NODE
          )" || { echo "REFUSE published_kernel: no pinned fresh-Lean recipe for $RELEASE_TAG" >&2; exit 1; }
          read -r repository commit <<<"$pin"
          git clone --depth 1 "$repository" "$RUNNER_TEMP/pinned-source"
          git -C "$RUNNER_TEMP/pinned-source" fetch --depth 1 origin "$commit"
          git -C "$RUNNER_TEMP/pinned-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/pinned-source" rev-parse HEAD)" = "$commit"
          cd "$RUNNER_TEMP/pinned-source"
          wasm_dir=wasm-spike
          scripts_dir=scripts
          mcp_dir=.lake/packages/mcp-seal
          bash "$wasm_dir"/provision_toolchain.sh
          python3 "$scripts_dir"/install_pinned_elan.py --mathlib-cache
          if [[ ! -d "$mcp_dir" ]]; then /home/monkey/bin/leanbuild update; fi
          bash "$mcp_dir"/c/build.sh
          /home/monkey/bin/leanbuild build
          cd "$wasm_dir"
          for script in build_runtime_wasm.sh build_base.sh build_core.sh build_closure.sh; do bash "$script"; done
          runner=build_wasm.sh
          bash "$runner" strict
          output_dir=build-core
          kernel=seal.wasm
          cp "$output_dir"/"$kernel" "$RUNNER_TEMP/rebuilt-seal.wasm"
      - name: SAME-AUTHORITY LINUX-X64 ARTIFACT KERNEL CORRESPONDENCE
        run: |
          node scripts/check-published-kernel.cjs --release-tag "$RELEASE_TAG" --platform linux-x64 \
            --rebuilt-wasm "$RUNNER_TEMP/rebuilt-seal.wasm"
