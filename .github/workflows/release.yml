# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  pull-requests: write
  actions: read
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tag to identify this exact commit
        run: test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
      - name: Require successful default-branch CI on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success \
            --json databaseId,headBranch --jq '[.[] | select(.headBranch == "main")][0].databaseId')"
          test -n "$run_id"
          echo "Exact-commit default-branch CI run: $run_id"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Publishing is the one act that cannot be undone, so it fails closed.
      # If origin cannot answer for its release tags, this refuses; ordinary
      # product tests do not, because they consume the single version-identity
      # job in ci.yml instead of asking origin themselves.
      - name: Refuse to publish when release tags cannot be read
        run: node scripts/check-version-identity.cjs
      - name: Build the one Linux x86-64 install artifact
        run: node scripts/build-dist.cjs --out "$RUNNER_TEMP/dist"
      - name: Require the artifact name to be the released identity
        run: node scripts/check-artifact-identity.cjs --dist "$RUNNER_TEMP/dist"
      - name: Require the artifact version to match the tag
        run: |
          version="$(tr -d '\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$version"
          test -f "$RUNNER_TEMP/dist/seal-v${version}-linux-x64"
          grep -F "seal-v${version}-linux-x64" "$RUNNER_TEMP/dist/SHA256SUMS"
      - name: Claude Code evidence must name this exact artifact
        run: |
          read -r digest bytes name < "$RUNNER_TEMP/dist/SHA256SUMS"
          # Manual acceptance evidence gates the release only when it exists,
          # and only when it names THIS artifact: a pack whose recorded file
          # hashes or artifact identity do not hold fails the release, while an
          # absent pack states the untested row and continues.
          client_identity_args=()
          if [[ -n "${SEAL_CLAUDE_CODE_EXECUTABLE_SHA256:-}" ]]; then
            client_identity_args=(--client-executable-sha256 "$SEAL_CLAUDE_CODE_EXECUTABLE_SHA256")
          fi
          node scripts/check-cc-evidence.mjs evidence/claude-code \
            --release --artifact-sha256 "$digest" --artifact-bytes "$bytes" \
            --label-out "$RUNNER_TEMP/claude-code-label.txt" \
            "${client_identity_args[@]}"

      - name: Publish the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          version="$(tr -d '\n' < VERSION)"
          artifact="$RUNNER_TEMP/dist/seal-v${version}-linux-x64"
          artifact_name="$(basename "$artifact")"
          checker="$RUNNER_TEMP/dist/seal-receipt-check.mjs"
          cp checker/seal-receipt-check.mjs "$checker"
          checker_digest="$(sha256sum "$checker" | awk '{ print $1 }')"
          checker_bytes="$(wc -c < "$checker" | tr -d ' ')"
          printf '%s  %s  %s\n' "$checker_digest" "$checker_bytes" "seal-receipt-check.mjs" >> "$RUNNER_TEMP/dist/SHA256SUMS"
          read -r digest bytes checksum_name < "$RUNNER_TEMP/dist/SHA256SUMS"
          test "$checksum_name" = "$artifact_name"
          grep -F "seal-receipt-check.mjs" "$RUNNER_TEMP/dist/SHA256SUMS"
          node scripts/create-release-manifest.mjs \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --artifact "$artifact" \
            --checker "$checker" \
            --checksums "$RUNNER_TEMP/dist/SHA256SUMS" \
            --out "$RUNNER_TEMP/dist/release-manifest.json"
          notes="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' \
            "Seal v${version}." \
            "macOS source portability is CI-exercised for install, demo and receipt checking. Protect is not supported on macOS yet." \
            "Linux x86-64 is the supported Protect path. Windows, Linux ARM and other platforms are unsupported." \
            '' \
            "The installable artifact is the single file \`${artifact_name}\`." \
            'Its command is generated from the built artifact and `SHA256SUMS`:' \
            '' \
            "    ./${artifact_name} --sha256 ${digest} --bytes ${bytes} --prefix ~/.local" \
            '' \
            'Altered bytes refuse. A missing, truncated or unreadable file refuses by name.' \
            'This file is not a signature and not a compiled native binary. Node >= 20 is required.' \
            '' \
            'Claude Code integration status for this artifact:' \
            '' > "$notes"
          sed 's/^/    /' "$RUNNER_TEMP/claude-code-label.txt" >> "$notes"
          prerelease=()
          if [[ "$version" == *rc* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$artifact" \
            "$checker" \
            "$RUNNER_TEMP/dist/SHA256SUMS" \
            "$RUNNER_TEMP/dist/release-manifest.json" \
            "${prerelease[@]}" \
            --verify-tag --title "seal $GITHUB_REF_NAME" --notes-file "$notes"
      - name: Attest release assets
        # Human post-release verification workflow path: .github/workflows/release.yml
        # CI release-download provenance remains absent here: .github/workflows/ci.yml
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ runner.temp }}/dist/seal-v*-linux-x64
            ${{ runner.temp }}/dist/seal-receipt-check.mjs
            ${{ runner.temp }}/dist/SHA256SUMS
            ${{ runner.temp }}/dist/release-manifest.json

  release-docs:
    # Publication is complete before this job starts. A documentation failure
    # can report or delay the follow-up commit, but cannot alter the release.
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Open or refresh the post-publication documentation pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SEAL_EXPECTED_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          branch="release-docs/$GITHUB_REF_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pr_number=""
          for attempt in 1 2 3; do
            git fetch origin main '+refs/heads/release-docs/*:refs/remotes/origin/release-docs/*'
            base_sha="$(git rev-parse origin/main)"
            git checkout -B "$branch" "$base_sha"
            node scripts/generate-release-docs.mjs
            if git diff --quiet -- README.md docs/start/install.md; then
              echo "release docs already name $GITHUB_REF_NAME on main $base_sha"
              exit 0
            fi
            git add README.md docs/start/install.md
            git commit -m "docs: generate install blocks for $GITHUB_REF_NAME"
            git push --force-with-lease origin "HEAD:refs/heads/$branch"
            pr_number="$(gh pr list --state open --base main --head "$branch" --json number --jq '.[0].number')"
            if [[ -z "$pr_number" ]]; then
              pr_url="$(gh pr create --base main --head "$branch" \
                --title "docs: publish install facts for $GITHUB_REF_NAME" \
                --body "Generated from the published $GITHUB_REF_NAME release. Review and required checks must pass before merge.")"
              pr_number="${pr_url##*/}"
            fi
            remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            if [[ "$remote_main" = "$base_sha" ]]; then
              echo "::notice::release documentation is ready for human review in PR #$pr_number"
              exit 0
            fi
            echo "main moved from $base_sha to $remote_main while preparing PR #$pr_number; regenerating (attempt $attempt of 3)"
          done
          echo "::error::main kept moving while release documentation PR #$pr_number was refreshed; the PR remains visible and a human can rerun this job"
          exit 1
