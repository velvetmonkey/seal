# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tag to identify this exact commit
        run: test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
      - name: Require successful default-branch CI on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success \
            --json databaseId,headBranch --jq '[.[] | select(.headBranch == "main")][0].databaseId')"
          test -n "$run_id"
          echo "Exact-commit default-branch CI run: $run_id"
      - name: Build the reproducible umbrella source archive and evidence
        run: scripts/build-release.sh seal "$GITHUB_REF_NAME" "$RUNNER_TEMP/release"
      - name: Publish the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' \
            'This release provides a reproducible source archive of the Seal umbrella documentation and static product-family site.' \
            '' \
            'It is source and tracked static content, not a compiled binary, a build of sibling repositories, or proof that Seal or its supply chain is bug-free. See `SHA256SUMS` for the archive digest and `SEAL-RELEASE-PROVENANCE.json` for the workflow run, commit, and builder record.' > "$notes"
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release/seal-$GITHUB_REF_NAME.tar.gz" \
            "$RUNNER_TEMP/release/SHA256SUMS" \
            "$RUNNER_TEMP/release/SEAL-RELEASE-PROVENANCE.json" \
            --verify-tag --title "seal $GITHUB_REF_NAME" --notes-file "$notes"

