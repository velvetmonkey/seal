# SPDX-License-Identifier: Apache-2.0
name: Docs & claims consistency
on:
  push:
  pull_request:
jobs:
  protected-path-human-ruling:
    name: protected path human ruling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse protected artifact edits pending a human ruling
        shell: bash
        run: |
          set -euo pipefail
          range="$(node scripts/resolve-ci-diff-range.cjs \
            --event-name "$GITHUB_EVENT_NAME" --event-path "$GITHUB_EVENT_PATH")"
          IFS=' ' read -r base head extra <<< "$range"
          if [[ -z "$base" || -z "$head" || -n "$extra" ]]; then
            echo "::error::CI_DIFF_RANGE_UNREADABLE: resolver did not return exactly one base and one head."
            exit 1
          fi
          node scripts/check-protected-paths.cjs --base "$base" --head "$head"

  installed-tree-pin-manifest-human-review:
    name: installed-tree pin manifest human review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse silent installed-tree pin manifest edits
        shell: bash
        run: |
          set -euo pipefail
          range="$(node scripts/resolve-ci-diff-range.cjs \
            --event-name "$GITHUB_EVENT_NAME" --event-path "$GITHUB_EVENT_PATH")"
          IFS=' ' read -r base head extra <<< "$range"
          if [[ -z "$base" || -z "$head" || -n "$extra" ]]; then
            echo "::error::CI_DIFF_RANGE_UNREADABLE: resolver did not return exactly one base and one head."
            exit 1
          fi
          node scripts/check-installed-tree-pin-manifest-review.cjs --base "$base" --head "$head"

  demo-receipt-provenance:
    name: demo receipt provenance
    # The row named "UNVERIFIED: demo receipt provenance (release absent)" is
    # present in both states: it succeeds when the release is genuinely absent
    # and nothing was verified. It is skipped when the release exists and was
    # verified for real, so the row's conclusion carries the meaning, not its
    # presence.
    # This boundary depends on GitHub-operated infrastructure. Do not change
    # this to a self-hosted label: a runner controlled by the operator would
    # not provide the provenance this job documents.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      release_state: ${{ steps.produce_demo_receipt.outputs.release_state }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: "Negative control: unavailable OIDC fails rather than skips"
        shell: bash
        run: |
          set -euo pipefail
          if env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
            bash -c 'set -euo pipefail; test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"; test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"'; then
            echo "::error::the absent-OIDC guard unexpectedly passed"
            exit 1
          fi
          echo "EXPECTED: absent OIDC credentials fail before evidence production."
      - name: Require a GitHub Actions OIDC token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          oidc_response="$RUNNER_TEMP/seal-demo-oidc-token.json"
          curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=seal-demo-receipt-provenance" \
            > "$oidc_response"
          node -e 'const response = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if (typeof response.value !== "string" || response.value.length === 0) process.exit(1)' "$oidc_response"
          rm -f "$oidc_response"
      - name: "Produce and check the demo receipt (UNVERIFIED if prerelease release is absent)"
        id: produce_demo_receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/demo-receipt-evidence"
          demo_dir="$RUNNER_TEMP/seal-demo"
          release_dir="$RUNNER_TEMP/seal-release"
          install_prefix="$RUNNER_TEMP/seal-install"
          committed_version="$RUNNER_TEMP/seal-committed-VERSION"
          git show "$GITHUB_SHA:VERSION" > "$committed_version"
          if ! cmp -s VERSION "$committed_version"; then
            echo "::error::RELEASE_PROVENANCE_VERSION_COMMIT_MISMATCH: VERSION is not byte-for-byte the VERSION committed at $GITHUB_SHA."
            exit 1
          fi
          if ! node -e 'const text = require("node:fs").readFileSync("VERSION", "utf8"); if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.([1-9][0-9]*)(?:\n)?$/.test(text)) process.exit(1)'; then
            echo "::error file=VERSION,line=1::RELEASE_PROVENANCE_BOOTSTRAP_TAG_INVALID: VERSION line 1 must be exactly <major>.<minor>.<patch>-rc.<n>, major/minor/patch must be 0 or start with 1-9, and rc must be 1 or greater; no surrounding whitespace; one final LF is permitted."
            exit 1
          fi
          release_tag="v$(tr -d '\n' < VERSION)"
          artifact_name="seal-$release_tag-linux-x64"
          mkdir -p "$evidence_dir" "$release_dir"
          # First establish that the repository exists.  A repository-level
          # 404 must never be mistaken for an absent release.
          set +e
          repository_lookup_response="$(gh api --include "repos/$GITHUB_REPOSITORY" 2>&1)"
          repository_lookup_command_status=$?
          set -e
          repository_lookup_status="$(printf '%s\n' "$repository_lookup_response" | awk '/^HTTP\// { status=$2 } END { if (status ~ /^[0-9][0-9][0-9]$/) print status }')"
          if [[ "$repository_lookup_status" != 200 || "$repository_lookup_command_status" -ne 0 ]]; then
            echo "::error::RELEASE_PROVENANCE_REPOSITORY_LOOKUP_FAILED: gh api --include repos/$GITHUB_REPOSITORY reported HTTP ${repository_lookup_status:-none} (command exit $repository_lookup_command_status)."
            exit 1
          fi
          # `gh api --include` writes an HTTP status line.  The status, not an
          # error message, is the release-existence fact: 404 means absent.
          set +e
          release_lookup_response="$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" 2>&1)"
          release_lookup_command_status=$?
          set -e
          release_lookup_status="$(printf '%s\n' "$release_lookup_response" | awk '/^HTTP\// { status=$2 } END { if (status ~ /^[0-9][0-9][0-9]$/) print status }')"
          if [[ -z "$release_lookup_status" ]]; then
            echo "::error::RELEASE_PROVENANCE_RELEASE_LOOKUP_FAILED: gh api --include repos/$GITHUB_REPOSITORY/releases/tags/$release_tag returned no HTTP status (command exit $release_lookup_command_status)."
            exit 1
          fi
          if [[ "$release_lookup_status" -eq 200 ]]; then
            if [[ "$release_lookup_command_status" -ne 0 ]]; then
              echo "::error::RELEASE_PROVENANCE_RELEASE_LOOKUP_FAILED: gh api --include repos/$GITHUB_REPOSITORY/releases/tags/$release_tag reported HTTP 200 but exited $release_lookup_command_status."
              exit 1
            fi
            gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" --dir "$release_dir" \
              --pattern SHA256SUMS --pattern "$artifact_name"
            if [[ ! -f "$release_dir/SHA256SUMS" ]]; then
              echo "::error::RELEASE_PROVENANCE_ASSETS_MISSING: published release $release_tag has no SHA256SUMS asset."
              exit 1
            fi
            read -r expected_digest expected_bytes expected_name < "$release_dir/SHA256SUMS"
            if [[ "$expected_name" != "$artifact_name" ]]; then
              echo "::error::RELEASE_PROVENANCE_ASSET_NAME_MISMATCH: SHA256SUMS names $expected_name; expected $artifact_name."
              exit 1
            fi
            actual_digest="$(sha256sum "$release_dir/$artifact_name" | cut -d' ' -f1)"
            if [[ "$actual_digest" != "$expected_digest" ]]; then
              echo "::error::RELEASE_PROVENANCE_DIGEST_MISMATCH: $artifact_name SHA-256 is $actual_digest; SHA256SUMS declares $expected_digest."
              exit 1
            fi
            actual_bytes="$(wc -c < "$release_dir/$artifact_name" | tr -d ' ')"
            if [[ "$actual_bytes" != "$expected_bytes" ]]; then
              echo "::error::RELEASE_PROVENANCE_BYTE_COUNT_MISMATCH: $artifact_name has $actual_bytes bytes; SHA256SUMS declares $expected_bytes."
              exit 1
            fi
            chmod +x "$release_dir/$artifact_name"
            "$release_dir/$artifact_name" --sha256 "$expected_digest" --bytes "$expected_bytes" \
              --prefix "$install_prefix"
            printf 'y\n' | script --quiet --return \
              --command "'$install_prefix/bin/seal' demo --dir '$demo_dir'" /dev/null \
              | tee "$evidence_dir/demo-output.txt"
            allow_receipt="$(find "$demo_dir/receipts" -maxdepth 1 -type f -name '*-ALLOW.json' -print -quit)"
            block_receipt="$(find "$demo_dir/receipts" -maxdepth 1 -type f -name '*-BLOCK.json' -print -quit)"
            checker="$(find "$install_prefix/lib/seal/store" -type f -path '*/checker/seal-receipt-check.mjs' -print -quit)"
            test -n "$allow_receipt"
            test -n "$block_receipt"
            test -n "$checker"
            node "$checker" "$allow_receipt" --pubkey "$demo_dir/receipt-signer.pub" \
              | tee "$evidence_dir/checker-output.txt"
            node "$checker" "$block_receipt" --pubkey "$demo_dir/receipt-signer.pub" \
              | tee -a "$evidence_dir/checker-output.txt"
            tampered_receipt="$evidence_dir/tampered-block.json"
            node -e 'const fs = require("node:fs"); const receipt = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); receipt.decision = "ALLOW"; fs.writeFileSync(process.argv[2], JSON.stringify(receipt, null, 2) + "\n");' \
              "$block_receipt" "$tampered_receipt"
            set +e
            node "$checker" "$tampered_receipt" --pubkey "$demo_dir/receipt-signer.pub" \
              | tee -a "$evidence_dir/checker-output.txt"
            tampered_status="${PIPESTATUS[0]}"
            set -e
            test "$tampered_status" -eq 1
            SEAL_DEMO_TRANSCRIPT="$evidence_dir/demo-output.txt" \
            SEAL_DEMO_CHECKER_TRANSCRIPT="$evidence_dir/checker-output.txt" \
              node scripts/readme-demo-transcript-guard.mjs
            cp "$allow_receipt" "$evidence_dir/demo-allow-receipt.json"
            cp "$demo_dir/receipt-signer.pub" "$evidence_dir/demo-receipt-signer.pub"
            echo "release_state=verified" >> "$GITHUB_OUTPUT"
          else
            if [[ "$release_lookup_status" -ne 404 ]]; then
              echo "::error::RELEASE_PROVENANCE_RELEASE_LOOKUP_FAILED: gh api --include repos/$GITHUB_REPOSITORY/releases/tags/$release_tag reported HTTP $release_lookup_status (command exit $release_lookup_command_status)."
              exit 1
            fi
            if [[ "$release_tag" != *-rc.* ]]; then
              echo "::error::RELEASE_PROVENANCE_RELEASE_MISSING_FOR_FINAL: $release_tag is not published; final versions cannot use the bootstrap window."
              exit 1
            fi
            loud_line="UNVERIFIED: NO RELEASE EXISTS FOR $release_tag; THIS RUN VERIFIED NOTHING ABOUT RELEASE ASSETS OR DEMO RECEIPT PROVENANCE."
            echo "::warning::$loud_line"
            printf '%s\n' "$loud_line" > "$evidence_dir/UNVERIFIED-NO-RELEASE.txt"
            {
              echo "## ⚠️ Demo receipt provenance UNVERIFIED"
              echo
              echo "**NO RELEASE EXISTS FOR $release_tag. THIS RUN VERIFIED NOTHING about release assets or demo receipt provenance.**"
              echo "The bootstrap window applies only to pre-release tags containing -rc.; publishing remains gated by successful CI on this exact commit."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "release_state=unverified" >> "$GITHUB_OUTPUT"
          fi
          git show "$GITHUB_SHA:.github/workflows/ci.yml" > "$evidence_dir/recorded-workflow.yml"
          tar -C "$evidence_dir" -czf "$RUNNER_TEMP/demo-receipt-evidence.tgz" .
      - name: Attest runner-produced demo receipt evidence
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/demo-receipt-evidence.tgz
      - name: Verify the attestation with the GitHub Actions token
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify "$RUNNER_TEMP/demo-receipt-evidence.tgz" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
      - name: "Negative control: tampered evidence fails attestation verification"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tampered="$RUNNER_TEMP/demo-receipt-evidence.tampered.tgz"
          cp "$RUNNER_TEMP/demo-receipt-evidence.tgz" "$tampered"
          printf 'x' >> "$tampered"
          if gh attestation verify "$tampered" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners; then
            echo "::error::tampered evidence unexpectedly verified"
            exit 1
          fi
          echo "EXPECTED: tampered evidence failed attestation verification."
      - name: "Negative control: a different local workflow is not checked by attestation verification"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          altered="$RUNNER_TEMP/ci.yml.altered"
          cp .github/workflows/ci.yml "$altered"
          printf '\n# deliberately different local copy\n' >> "$altered"
          if cmp -s "$altered" "$RUNNER_TEMP/demo-receipt-evidence/recorded-workflow.yml"; then
            echo "::error::workflow-difference control did not create a difference"
            exit 1
          fi
          gh attestation verify "$RUNNER_TEMP/demo-receipt-evidence.tgz" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
          echo "EXPECTED: verification does not inspect an unrelated local workflow copy."
      - name: Upload runner-produced evidence for signed-in reader download
        uses: actions/upload-artifact@v4
        with:
          name: demo-receipt-provenance
          path: ${{ runner.temp }}/demo-receipt-evidence.tgz
          if-no-files-found: error

  demo-receipt-provenance-unverified:
    name: "UNVERIFIED: demo receipt provenance (release absent)"
    needs: demo-receipt-provenance
    if: ${{ needs.demo-receipt-provenance.outputs.release_state == 'unverified' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report the bootstrap state in the check list
        run: echo "No release exists for this well-formed pre-release version; CI verified no release assets or demo receipt provenance."

  # The collision gate reaches origin for release tags. It is one question
  # about one commit, so it is asked ONCE, in one job, off the product matrix.
  # A tag-service outage now fails this job by name instead of reddening two
  # otherwise unrelated product suites.
  version-identity:
    name: version-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require one released version to identify one commit
        run: node scripts/check-version-identity.cjs

  # The bare-version refusal asks a different question and asks it offline:
  # does this build wear the released name without being the release? It must
  # stay answerable while origin is unreachable, so it carries no `needs`.
  artifact-identity:
    name: artifact-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Report the product identity of this commit
        run: node scripts/product-identity.cjs
      - name: Refuse an untagged build that wears the released name
        run: |
          node scripts/build-dist.cjs --out "$RUNNER_TEMP/identity-dist"
          node scripts/check-artifact-identity.cjs --dist "$RUNNER_TEMP/identity-dist"

  product-suite:
    name: product-suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # This is the enforced collision brake. It runs in the required check
      # itself, so no upstream result can turn a collision into a skipped pass.
      - name: Require one released version to identify one commit
        run: node scripts/check-version-identity.cjs
      - name: Expose the selected Node to the installed-artifact test
        shell: bash
        run: |
          selected_node="$(command -v node)"
          if [[ -e /usr/bin/node ]]; then
            test "$(readlink -f /usr/bin/node)" = "$(readlink -f "$selected_node")"
          else
            sudo ln -s "$selected_node" /usr/bin/node
          fi
      - name: Run and count the complete product suite
        shell: bash
        run: scripts/capture-complete-product-suite.sh

  # demoteci4: this local job observes only values and artefacts it controls.
  # It usefully exercises the demo path, but cannot prove to itself that its
  # checker ran instead of being staged; that requires external evidence.
  demo-receipt-checker:
    name: demo receipt checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and install the demo artifact
        shell: bash
        run: |
          dist="$RUNNER_TEMP/demo-receipt-dist"
          prefix="$RUNNER_TEMP/demo-receipt-prefix"
          node scripts/build-dist.cjs --out "$dist"
          read -r digest bytes artifact < "$dist/SHA256SUMS"
          "$dist/$artifact" --sha256 "$digest" --bytes "$bytes" --prefix "$prefix"
          test -x "$prefix/bin/seal"
          # The checker is a separate release asset, same shape as release.yml.
          checker="$dist/seal-receipt-check.mjs"
          cp checker/seal-receipt-check.mjs "$checker"
          checker_digest="$(sha256sum "$checker" | awk '{ print $1 }')"
          checker_bytes="$(wc -c < "$checker" | tr -d ' ')"
          printf '%s  %s  %s\n' "$checker_digest" "$checker_bytes" "seal-receipt-check.mjs" >> "$dist/SHA256SUMS"
          grep -F "seal-receipt-check.mjs" "$dist/SHA256SUMS"
      - name: Run the demo and check its emitted receipt
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/demo-receipt-prefix"
          export PATH="$prefix/bin:$PATH"
          demo_log="$RUNNER_TEMP/seal-demo.log"

          printf 'y\n' | seal demo 2>&1 | tee "$demo_log"
          demo_dir="$(sed -n 's/^temporary demo directory: \(.*\) (remains after the demo.*$/\1/p' "$demo_log")"
          if [[ -z "$demo_dir" || ! -d "$demo_dir/receipts" ]]; then
            echo '::error::seal demo produced no receipt directory'
            exit 1
          fi
          receipt="$(find "$demo_dir/receipts" -maxdepth 1 -type f -name '*-BLOCK.json' -print -quit)"
          pubkey="$demo_dir/receipt-signer.pub"
          if [[ -z "$receipt" || ! -f "$pubkey" ]]; then
            echo '::error::seal demo did not write the BLOCK receipt and public key required for checking'
            exit 1
          fi

          store="$prefix/lib/seal/store/$(node -p "require('$prefix/lib/seal/install.json').treeSha256")"
          if [[ -f "$store/checker/seal-receipt-check.mjs" ]]; then
            echo '::error::installed artifact must not contain the receipt checker'
            exit 1
          fi

          checker="$RUNNER_TEMP/demo-receipt-dist/seal-receipt-check.mjs"
          sums="$RUNNER_TEMP/demo-receipt-dist/SHA256SUMS"
          if [[ ! -f "$checker" ]]; then
            echo '::error::published checker is absent'
            exit 1
          fi
          if [[ ! -s "$checker" ]]; then
            echo '::error::published checker is empty'
            exit 1
          fi
          pin="$(awk '$3 == "seal-receipt-check.mjs" { print $1; exit }' "$sums")"
          got="$(sha256sum "$checker" | awk '{ print $1 }')"
          if [[ -z "$pin" || "$got" != "$pin" ]]; then
            echo '::error::published checker digest does not match SHA256SUMS'
            exit 1
          fi

          challenge="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          accept_result="$RUNNER_TEMP/demo-receipt-check-$challenge.json"
          tamper_result="$RUNNER_TEMP/tampered-receipt-check-$challenge.json"
          evidence_checker=".github/workflows/receipt-check-evidence.mjs"

          set +e
          node "$evidence_checker" check "$checker" "$receipt" "$pubkey" "$challenge" "$accept_result"
          accept_status=$?
          set -e
          if [[ "$accept_status" -ne 0 ]]; then
            echo "::error::live receipt checker exited $accept_status"
            exit 1
          fi

          tampered="$RUNNER_TEMP/tampered-receipt.json"
          node -e '
            const fs = require("node:fs");
            const [source, target] = process.argv.slice(1);
            const receipt = JSON.parse(fs.readFileSync(source, "utf8"));
            receipt.decision = "ALLOW";
            fs.writeFileSync(target, `${JSON.stringify(receipt, null, 2)}\n`);
          ' "$receipt" "$tampered"

          set +e
          node "$evidence_checker" check "$checker" "$tampered" "$pubkey" "$challenge" "$tamper_result"
          tamper_status=$?
          set -e
          if [[ "$tamper_status" -eq 0 ]]; then
            echo '::error::tampered receipt was accepted'
            exit 1
          fi
          echo "tamper checker exited $tamper_status as expected"
          node "$evidence_checker" validate "$receipt" "$tampered" "$challenge" "$accept_result" "$tamper_result"
          echo "LIMIT: This job shows the demo path with a key generated for this run; it does not prove a stranger's setup works, and it cannot prove to itself that the checker ran rather than being staged."

  docs-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # source inventory reads the held origin/main base
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse independently rolled executable populations
        run: node scripts/check-executable-population-callers.mjs
      - uses: actions/checkout@v4
        with:
          repository: velvetmonkey/seal-check
          ref: master
          path: .family/seal-check
      - uses: actions/checkout@v4
        with:
          repository: velvetmonkey/seal-demo
          ref: main
          path: .family/seal-demo
      - uses: actions/checkout@v4
        with:
          repository: velvetmonkey/seal-live-demo
          ref: master
          path: .family/seal-live-demo
      - uses: actions/checkout@v4
        with:
          repository: velvetmonkey/seal-verify-action
          ref: main
          path: .family/seal-verify-action
      - uses: actions/checkout@v4
        with:
          repository: velvetmonkey/seal-assurance-kit
          ref: main
          path: .family/seal-assurance-kit
      - uses: actions/checkout@v4
        with:
          repository: velvetmonkey/mcp-seal-dev
          ref: main
          path: .family/mcp-seal-dev
      - name: Check badge and launch-claim truth
        run: >-
          node scripts/launch-truth-gate.mjs
          README.md
          .github/workflows/ci.yml
          docs/assurance/evaluator-start.md
          docs/archive/WHY-DIFFERENT.md
          docs/assurance/index.html
      - run: node scripts/linkcheck.mjs
      - name: Check live seal-check landing-page claims against served bytes
        run: node scripts/live-page-claim-guard.mjs
      - run: node --test test/live-page-claim-guard.test.mjs
      - run: node scripts/readme-navigation.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/readme-claim-inventory.mjs
      - name: Inventory every claim-bearing prose file
        run: node scripts/claim-bearing-file-inventory.mjs
      - run: node --test test/claim-bearing-file-inventory.test.mjs
      - run: node scripts/claims-drift.mjs
      - run: node scripts/check-receipt-canonicalization.mjs
      - run: node scripts/claim-coverage-inventory.mjs
      - run: node --test test/claims-drift.test.mjs
      # Required CI compares the local claim block against the committed hash only; live sibling comparison is in family-claims-live.yml.
      - run: node scripts/claims-drift-family.mjs
      - name: Banned verification claims must not return (README included)
        run: node --test --test-name-pattern 'no banned verification claim' test/no-verification-claim.test.cjs
      - name: README install pin must match published release asset
        run: node --test test/dist-pin.test.cjs
      - name: README installer success transcript must match published release asset
        run: node scripts/check-readme-install-transcript.cjs
      - name: Any committed Claude Code evidence must verify
        shell: bash
        run: |
          if find evidence/claude-code -type f -name manifest.json 2>/dev/null | grep -q .; then
            node scripts/check-cc-evidence.mjs evidence/claude-code
          else
            echo "no Claude Code evidence pack in this tree; the client row stays UNTESTED"
          fi
