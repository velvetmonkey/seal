# SPDX-License-Identifier: Apache-2.0
name: Docs & claims consistency
on:
  push:
  pull_request:
jobs:
  product-suite:
    name: product-suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Expose the selected Node to the installed-artifact test
        shell: bash
        run: |
          selected_node="$(command -v node)"
          if [[ -e /usr/bin/node ]]; then
            test "$(readlink -f /usr/bin/node)" = "$(readlink -f "$selected_node")"
          else
            sudo ln -s "$selected_node" /usr/bin/node
          fi
      - name: Run and count the complete product suite
        shell: bash
        run: |
          output_file="$RUNNER_TEMP/seal-node-test.tap"
          set +e
          node --test 2>&1 | tee "$output_file"
          node_status=${PIPESTATUS[0]}
          set -e

          gate_status=0
          if (( node_status != 0 )); then
            echo "::error::node --test exited $node_status"
            gate_status=1
          fi
          if ! grep -Eq '^# fail 0$' "$output_file"; then
            echo "::error::node --test did not report exactly zero failures"
            gate_status=1
          fi
          if ! grep -Eq '^# tests 88$' "$output_file"; then
            echo "::error::node --test did not run exactly 88 tests"
            gate_status=1
          fi
          exit "$gate_status"

  docs-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # source inventory reads the held origin/main base
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check badge and launch-claim truth
        run: >-
          node scripts/launch-truth-gate.mjs
          README.md
          .github/workflows/ci.yml
          EVALUATOR-START.md
          docs/WHY-DIFFERENT.md
          index.html
      - run: node scripts/linkcheck.mjs
      - run: node scripts/readme-navigation.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/readme-claim-inventory.mjs
      - run: node scripts/claims-drift.mjs
      - run: node --test test/claims-drift.test.mjs
      - run: node scripts/claims-drift-family.mjs
      - name: Banned verification claims must not return (README included)
        run: node --test --test-name-pattern 'no banned verification claim' test/no-verification-claim.test.cjs
      - name: Published dist pin must match a freshly built artifact
        run: node --test test/dist-pin.test.cjs
