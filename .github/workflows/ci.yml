# SPDX-License-Identifier: Apache-2.0
name: Docs & claims consistency
on:
  push:
    branches: [main]
  pull_request:
jobs:
  protected-path-human-ruling:
    name: protected path human ruling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse protected artifact edits pending a human ruling
        shell: bash
        run: |
          set -euo pipefail
          range="$(node scripts/resolve-ci-diff-range.cjs \
            --event-name "$GITHUB_EVENT_NAME" --event-path "$GITHUB_EVENT_PATH")"
          IFS=' ' read -r base head extra <<< "$range"
          if [[ -z "$base" || -z "$head" || -n "$extra" ]]; then
            echo "::error::CI_DIFF_RANGE_UNREADABLE: resolver did not return exactly one base and one head."
            exit 1
          fi
          node scripts/check-protected-paths.cjs --base "$base" --head "$head"

  installed-tree-pin-manifest-human-review:
    name: installed-tree pin manifest human review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuse silent installed-tree pin manifest edits
        shell: bash
        run: |
          set -euo pipefail
          range="$(node scripts/resolve-ci-diff-range.cjs \
            --event-name "$GITHUB_EVENT_NAME" --event-path "$GITHUB_EVENT_PATH")"
          IFS=' ' read -r base head extra <<< "$range"
          if [[ -z "$base" || -z "$head" || -n "$extra" ]]; then
            echo "::error::CI_DIFF_RANGE_UNREADABLE: resolver did not return exactly one base and one head."
            exit 1
          fi
          node scripts/check-installed-tree-pin-manifest-review.cjs --base "$base" --head "$head"

  # The collision gate reaches origin for release tags. It is one question
  # about one commit, so it is asked ONCE, in one job, off the product matrix.
  # A tag-service outage now fails this job by name instead of reddening two
  # otherwise unrelated product suites.
  version-identity:
    name: version-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require one released version to identify one commit
        run: node scripts/check-version-identity.cjs

  # The bare-version refusal asks a different question and asks it offline:
  # does this build wear the released name without being the release? It must
  # stay answerable while origin is unreachable, so it carries no `needs`.
  artifact-identity:
    name: artifact-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Report the product identity of this commit
        run: node scripts/product-identity.cjs
      - name: Refuse an untagged build that wears the released name
        run: |
          node scripts/build-dist.cjs --out "$RUNNER_TEMP/identity-dist"
          node scripts/check-artifact-identity.cjs --dist "$RUNNER_TEMP/identity-dist"

  product-suite:
    name: product-suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Refuse development-box paths in workflows
        run: node scripts/check-workflow-host-paths.cjs
      - name: Require same-process pinned Lean launcher resolution
        run: node scripts/check-pinned-lean-launcher.cjs
      # This is the enforced collision brake. It runs in the required check
      # itself, so no upstream result can turn a collision into a skipped pass.
      - name: Require one released version to identify one commit
        run: node scripts/check-version-identity.cjs
      - name: Expose the selected Node to the installed-artifact test
        shell: bash
        run: |
          selected_node="$(command -v node)"
          if [[ -e /usr/bin/node ]]; then
            test "$(readlink -f /usr/bin/node)" = "$(readlink -f "$selected_node")"
          else
            sudo ln -s "$selected_node" /usr/bin/node
          fi
      - name: Run and count the complete product suite
        shell: bash
        run: scripts/run-complete-product-suite.sh

  # demoteci4: this local job observes only values and artefacts it controls.
  # It usefully exercises the demo path, but cannot prove to itself that its
  # checker ran instead of being staged; that requires external evidence.
  demo-receipt-checker:
    name: demo receipt checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and install the demo artifact
        shell: bash
        run: |
          dist="$RUNNER_TEMP/demo-receipt-dist"
          prefix="$RUNNER_TEMP/demo-receipt-prefix"
          node scripts/build-dist.cjs --out "$dist"
          read -r digest bytes artifact < "$dist/SHA256SUMS"
          "$dist/$artifact" --sha256 "$digest" --bytes "$bytes" --prefix "$prefix"
          test -x "$prefix/bin/seal"
      - name: Run the demo and check its emitted receipt
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/demo-receipt-prefix"
          export PATH="$prefix/bin:$PATH"
          demo_log="$RUNNER_TEMP/seal-demo.log"

          printf 'y\n' | seal demo 2>&1 | tee "$demo_log"
          demo_dir="$(sed -n 's/^temporary demo directory: \(.*\) (remains after the demo.*$/\1/p' "$demo_log")"
          if [[ -z "$demo_dir" || ! -d "$demo_dir/receipts" ]]; then
            echo '::error::seal demo produced no receipt directory'
            exit 1
          fi
          receipt="$(find "$demo_dir/receipts" -maxdepth 1 -type f -name '*-BLOCK.json' -print -quit)"
          pubkey="$demo_dir/receipt-signer.pub"
          if [[ -z "$receipt" || ! -f "$pubkey" ]]; then
            echo '::error::seal demo did not write the BLOCK receipt and public key required for checking'
            exit 1
          fi

          store="$prefix/lib/seal/store/$(node -p "require('$prefix/lib/seal/install.json').treeSha256")"
          if [[ ! -f "$store/checker/seal-receipt-v2.mjs" ]]; then
            echo '::error::installed artifact must contain the v2 receipt checker'
            exit 1
          fi

          # checker/seal-receipt-v2.mjs runs here with its installed runtime sibling.
          checker="$store/checker/seal-receipt-v2.mjs"

          challenge="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          accept_result="$RUNNER_TEMP/demo-receipt-check-$challenge.json"
          tamper_result="$RUNNER_TEMP/tampered-receipt-check-$challenge.json"
          evidence_checker=".github/workflows/receipt-check-evidence.mjs"

          set +e
          node "$evidence_checker" check "$checker" "$receipt" "$pubkey" "$challenge" "$accept_result"
          accept_status=$?
          set -e
          if [[ "$accept_status" -ne 0 ]]; then
            echo "::error::live receipt checker exited $accept_status"
            exit 1
          fi

          tampered="$RUNNER_TEMP/tampered-receipt.json"
          node -e '
            const fs = require("node:fs");
            const [source, target] = process.argv.slice(1);
            const receipt = JSON.parse(fs.readFileSync(source, "utf8"));
            receipt.action = "ALLOW";
            fs.writeFileSync(target, JSON.stringify(receipt));
          ' "$receipt" "$tampered"

          set +e
          node "$evidence_checker" check "$checker" "$tampered" "$pubkey" "$challenge" "$tamper_result"
          tamper_status=$?
          set -e
          if [[ "$tamper_status" -eq 0 ]]; then
            echo '::error::tampered receipt was accepted'
            exit 1
          fi
          echo "tamper checker exited $tamper_status as expected"
          node "$evidence_checker" validate "$receipt" "$tampered" "$challenge" "$accept_result" "$tamper_result"
          echo "LIMIT: This job shows the demo path with a key generated for this run; it does not prove a stranger's setup works, and it cannot prove to itself that the checker ran rather than being staged."

  docs-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # source inventory reads the held origin/main base
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Release docs must match the latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/generate-release-docs.mjs --check
      - name: Refuse independently rolled executable populations
        run: node scripts/check-executable-population-callers.mjs
      - uses: actions/checkout@v4
        with:
          repository: velvetmonkey/seal-check
          ref: master
          path: .family/seal-check
      - uses: actions/checkout@v4
        with:
          repository: velvetmonkey/seal-demo
          ref: main
          path: .family/seal-demo
      - uses: actions/checkout@v4
        with:
          repository: velvetmonkey/seal-live-demo
          ref: master
          path: .family/seal-live-demo
      - uses: actions/checkout@v4
        with:
          repository: velvetmonkey/seal-verify-action
          ref: main
          path: .family/seal-verify-action
      - uses: actions/checkout@v4
        with:
          repository: velvetmonkey/seal-assurance-kit
          ref: main
          path: .family/seal-assurance-kit
      - uses: actions/checkout@v4
        with:
          repository: velvetmonkey/mcp-seal-dev
          ref: main
          path: .family/mcp-seal-dev
      - name: Check badge and launch-claim truth
        run: >-
          node scripts/launch-truth-gate.mjs
          README.md
          .github/workflows/ci.yml
          docs/assurance/evaluator-start.md
          docs/archive/WHY-DIFFERENT.md
          docs/assurance/index.html
      - run: node scripts/linkcheck.mjs
      - name: Check live seal-check landing-page claims against served bytes
        run: node scripts/live-page-claim-guard.mjs
      - run: node --test test/live-page-claim-guard.test.mjs
      - run: node scripts/readme-navigation.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/readme-claim-inventory.mjs
      - name: Inventory every claim-bearing prose file
        run: node scripts/claim-bearing-file-inventory.mjs
      - run: node --test test/claim-bearing-file-inventory.test.mjs
      - run: node scripts/claims-drift.mjs
      - run: node --test test/receipt-checker.test.cjs
      - run: node scripts/claim-coverage-inventory.mjs
      - run: node --test test/claims-drift.test.mjs
      # Required CI compares the local claim block against the committed hash only; live sibling comparison is in family-claims-live.yml.
      - run: node scripts/claims-drift-family.mjs
      - name: Banned verification claims must not return (README included)
        run: node --test --test-name-pattern 'no banned verification claim' test/no-verification-claim.test.cjs
      - name: README install pin must match published release asset
        run: node --test test/dist-pin.test.cjs
      - name: README installer success transcript must match published release asset
        run: node scripts/check-readme-install-transcript.cjs
      - name: Any committed Claude Code evidence must verify
        shell: bash
        run: |
          if find evidence/claude-code -type f -name manifest.json 2>/dev/null | grep -q .; then
            node scripts/check-cc-evidence.mjs evidence/claude-code
          else
            echo "no Claude Code evidence pack in this tree; the client row stays UNTESTED"
          fi
