# SPDX-License-Identifier: Apache-2.0
name: Authorization seam differential

on:
  push:
    branches: [main]
  pull_request:

jobs:
  authorization-seam-differential:
    name: interpreted Lean vs shipped WASM
    runs-on: ubuntu-latest
    env:
      SEAL_INTERPRETED_LEAN_ROOT: ${{ github.workspace }}/.interpreted/seal-host
    steps:
      - name: Check out the product
        uses: actions/checkout@v4

      - name: Provision Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check out the provenance-matching Lean source
        uses: actions/checkout@v4
        with:
          repository: velvetmonkey/seal-host
          ref: 018d1a346db233b7faa1ea6d8e9c88054b978e49
          path: .interpreted/seal-host
          persist-credentials: false

      - name: Provision Lean 4.28.0 and build the pinned import graph
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .interpreted/seal-host
          auto-config: false
          build: true
          build-args: Ffi
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Run the interpreted-Lean versus shipped-WASM differential
        run: node --test test-support/authorization-seam-differential.test.cjs
