# SPDX-License-Identifier: Apache-2.0
name: Authorization seam differential

on:
  push:
    branches: [main]
  pull_request:

jobs:
  authorization-seam-differential:
    name: interpreted Lean vs shipped WASM
    runs-on: ubuntu-latest
    env:
      SEAL_INTERPRETED_LEAN_ROOT: ${{ github.workspace }}
    steps:
      - name: Check out the product
        uses: actions/checkout@v4

      - name: Provision Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Provision pinned Lean and build the pinned import graph
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .
          auto-config: false
          build: true
          build-args: +Ffi:c.o.export AuthorizationCorrespondenceProof
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Expose the built in-tree path dependency to import discovery
        run: ln -s ../../kernel-source .lake/packages/mcp-seal

      - name: Run the interpreted-Lean versus shipped-WASM differential
        run: |
          export ELAN_TOOLCHAIN="$(cat "$SEAL_INTERPRETED_LEAN_ROOT/lean-toolchain")"
          echo "Resolved ELAN_TOOLCHAIN=$ELAN_TOOLCHAIN from $SEAL_INTERPRETED_LEAN_ROOT/lean-toolchain"
          node scripts/build-dist.cjs --out "$RUNNER_TEMP/seam-dist"
          read -r digest bytes asset < "$RUNNER_TEMP/seam-dist/SHA256SUMS"
          "$RUNNER_TEMP/seam-dist/$asset" --sha256 "$digest" --bytes "$bytes" --prefix "$RUNNER_TEMP/seam-prefix"
          candidate_root="$(node -e 'const fs=require("fs"),p=require("path"),r=process.argv[1]; console.log(p.join(r,JSON.parse(fs.readFileSync(p.join(r,"lib/seal/install.json"))).store))' "$RUNNER_TEMP/seam-prefix")"
          node test-support/authorization-seam-differential.test.cjs \
            --candidate-root "$candidate_root" --source-root "$SEAL_INTERPRETED_LEAN_ROOT" \
            --corpus test-support/authorization-correspondence-corpus.jsonl \
            --evidence "$RUNNER_TEMP/seam-evidence/result.json"
