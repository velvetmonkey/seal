# SPDX-License-Identifier: Apache-2.0
name: Authorization seam differential

on:
  push:
    branches: [main]
  pull_request:

jobs:
  authorization-seam-differential:
    name: interpreted Lean vs shipped WASM
    runs-on: ubuntu-latest
    env:
      SEAL_INTERPRETED_LEAN_ROOT: ${{ github.workspace }}
    steps:
      - name: Check out the product
        uses: actions/checkout@v4

      - name: Provision Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Provision pinned Lean and build the pinned import graph
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: kernel-source
          auto-config: false
          build: true
          build-args: +Ffi:c.o.export
          test: false
          lint: false
          # kernel-source depends on Batteries and Aesop, not Mathlib; asking the
          # action for Mathlib's cache runs the unavailable `lake exe cache get`.
          use-mathlib-cache: false

      - name: Run the interpreted-Lean versus shipped-WASM differential
        run: |
          export ELAN_TOOLCHAIN="$(cat "$SEAL_INTERPRETED_LEAN_ROOT/lean-toolchain")"
          echo "Resolved ELAN_TOOLCHAIN=$ELAN_TOOLCHAIN from $SEAL_INTERPRETED_LEAN_ROOT/lean-toolchain"
          node --test test-support/authorization-seam-differential.test.cjs
