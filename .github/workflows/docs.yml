name: Documentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Read the Pages deployment address
        id: pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: false
      - name: Derive the site address from the deployment
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: echo "SITE_URL=${PAGES_BASE_URL}/" >> "$GITHUB_ENV"
      - name: Set up Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install documentation dependencies
        run: npm --prefix docs ci
      - name: Build documentation at the deployment address
        run: npm --prefix docs run build
      - name: Crawl built pages, assets, anchors and external links
        timeout-minutes: 3
        run: python3 docs/check-links.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/dist

  deploy:
    needs: docs-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'velvetmonkey/seal'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
