<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1775 970" role="img" aria-labelledby="title desc">
  <title id="title">How one MCP tool call passes through Seal</title>
  <desc id="desc">An agent reads pinned configuration, then sends one protected MCP tool through Seal's human gate, pinned WebAssembly kernel, and one-use counter. Seal forwards demo.mutate to the MCP server and records a signed receipt. Two other tools from the protected server are not approval-gated, but pass through Seal's forwarding checks. The protected call changes that resource once.</desc>
  <defs>
    <style>
      :root { --bg: #f7f1e5; --ink: #282622; --accent: #a23e22; --muted: #66645f; }
      text { fill: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .h1 { font-size: 26px; font-weight: 800; letter-spacing: 1px; }
      .h2 { font-size: 20px; font-weight: 800; letter-spacing: .7px; }
      .label { font-size: 17px; font-weight: 800; }
      .body { font-size: 15px; font-weight: 600; }
      .small { font-size: 13px; font-weight: 600; }
      .tiny { font-size: 11px; font-weight: 600; }
      .accent-text { fill: var(--accent); }
      .muted-text { fill: var(--muted); }
      .ink { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .accent { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .muted { fill: none; stroke: var(--muted); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l8 4-8 4z" fill="#a23e22"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l8 4-8 4z" fill="#66645f"/>
    </marker>
    <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l8 4-8 4z" fill="#282622"/>
    </marker>
  </defs>

  <rect width="1775" height="970" fill="#f7f1e5"/>

  <!-- AGENT: global box padding is at least 16px; icon geometry is 75% of base. -->
  <g aria-label="Agent terminal">
    <rect data-padding="16" x="28" y="235" width="158" height="178" rx="8" class="ink"/>
    <g data-icon="agent-terminal" transform="translate(102 324) scale(.75) translate(-102 -324)">
      <path d="M38 273h128" class="ink"/>
      <circle cx="55" cy="260" r="3" class="ink"/>
      <circle cx="70" cy="260" r="3" class="ink"/>
      <circle cx="85" cy="260" r="3" class="ink"/>
      <path d="M61 359l13 12-13 12M82 384h19" class="ink"/>
    </g>
    <text x="107" y="310" text-anchor="middle" class="h2">AGENT</text>
    <text x="107" y="341" text-anchor="middle" class="body">Claude Code</text>
  </g>

  <!-- Protected wire enters config, then Seal. -->
  <path d="M186 327h35" class="accent" marker-end="url(#arrow-accent)"/>

  <!-- CONFIG: global box padding is at least 16px; file icon is 28x39 -> 21x29. -->
  <g aria-label="Configuration and Claude Code local-scope override">
    <rect data-padding="16" x="230" y="25" width="250" height="620" rx="8" class="ink"/>
    <text x="355" y="63" text-anchor="middle" class="h2">CONFIG</text>
    <text x="355" y="92" text-anchor="middle" class="small">claude mcp add</text>
    <text x="355" y="111" text-anchor="middle" class="small">installs same-name</text>
    <text x="355" y="130" text-anchor="middle" class="small">local entry;</text>
    <text x="355" y="149" text-anchor="middle" class="small">shadows project</text>
    <text x="355" y="168" text-anchor="middle" class="small">after restart</text>

    <path data-icon="project-config-file" d="M250 184h14l7 7v22h-21zM264 184v7h7" class="ink"/>
    <text x="286" y="202" class="body">.mcp.json</text>
    <text x="286" y="228" class="small">read only;</text>
    <text x="286" y="247" class="small">never modified</text>

    <path d="M250 276h210" class="ink" stroke-dasharray="8 8"/>
    <text x="355" y="313" text-anchor="middle" class="label">DRIFT</text>
    <text x="355" y="342" text-anchor="middle" class="small">project server entry</text>
    <text x="355" y="361" text-anchor="middle" class="small">differs from its</text>
    <text x="355" y="380" text-anchor="middle" class="small">recorded digest</text>
    <text x="355" y="414" text-anchor="middle" class="small">-&gt; FORWARDING</text>
    <text x="355" y="435" text-anchor="middle" class="label accent-text">REFUSED</text>
    <path d="M272 478c0 18 13 27 47 27" class="accent" stroke-dasharray="8 7" marker-end="url(#arrow-accent)"/>
    <path d="M374 489l24 24M398 489l-24 24" class="accent"/>
  </g>
  <path d="M480 327h21" class="accent" marker-end="url(#arrow-accent)"/>

  <!-- SEAL -->
  <g aria-label="Seal protects one tool of one server">
    <rect data-padding="16" x="510" y="25" width="690" height="620" rx="12" class="ink"/>
    <text x="535" y="79" class="h1">SEAL</text>
    <text x="535" y="107" class="body">one tool of one server</text>

    <!-- THE GATE -->
    <text x="571" y="166" text-anchor="middle" class="h2">THE GATE</text>
    <text x="571" y="191" text-anchor="middle" class="small">approve this</text>
    <text x="571" y="210" text-anchor="middle" class="small">exact call?</text>
    <g data-icon="gate" transform="translate(572 331) scale(.75) translate(-572 -331)">
      <path d="M530 250v165M542 250v165M603 250v165M615 250v165" class="ink"/>
      <circle cx="572" cy="316" r="10" class="ink"/>
      <path d="M555 347c1-17 8-26 17-26s16 9 17 26z" class="ink"/>
    </g>
    <path d="M501 331h23" class="accent" marker-end="url(#arrow-accent)"/>
    <path d="M615 331h52" class="accent" marker-end="url(#arrow-accent)"/>

    <!-- KERNEL -->
    <text x="747" y="166" text-anchor="middle" class="h2">KERNEL</text>
    <text x="747" y="189" text-anchor="middle" class="small">pinned WASM decides.</text>
    <text x="747" y="208" text-anchor="middle" class="small">Node cannot overrule</text>
    <text x="747" y="227" text-anchor="middle" class="small">a refusal</text>
    <g data-icon="kernel" transform="translate(746 334) scale(.75) translate(-746 -334)">
      <path d="M708 269h75l32 62-32 68h-75l-31-68z" class="ink"/>
      <text x="746" y="321" text-anchor="middle" class="label">KERNEL</text>
      <!-- Anchor glyph, deliberately neutral and distinct from a pin/Venus symbol. -->
      <circle cx="746" cy="339" r="6" class="ink"/>
      <path d="M746 345v27M731 357h30M731 358c0 17 30 17 30 0M736 372h20" class="ink"/>
    </g>
    <path d="M815 331h47" class="accent" marker-end="url(#arrow-accent)"/>

    <!-- ONE USE -->
    <text x="925" y="166" text-anchor="middle" class="h2">ONE USE</text>
    <text x="925" y="190" text-anchor="middle" class="small">counter 0 -&gt; 1.</text>
    <text x="925" y="209" text-anchor="middle" class="small">replay refused</text>
    <g data-icon="one-use" transform="translate(922 331) scale(.75) translate(-922 -331)">
      <circle cx="885" cy="331" r="21" class="ink"/>
      <text x="885" y="339" text-anchor="middle" class="label">0</text>
      <path d="M909 331h23" class="ink" marker-end="url(#arrow-ink)"/>
      <circle cx="959" cy="331" r="21" class="ink"/>
      <text x="959" y="339" text-anchor="middle" class="label">1</text>
    </g>
    <path d="M982 331h46" class="accent" marker-end="url(#arrow-accent)"/>

    <!-- RECEIPT -->
    <text x="1090" y="166" text-anchor="middle" class="h2">RECEIPT</text>
    <text x="1090" y="190" text-anchor="middle" class="small">signed. the only</text>
    <text x="1090" y="209" text-anchor="middle" class="small">thing Seal keeps</text>
    <g data-icon="receipt" transform="translate(1088 338) scale(.75) translate(-1088 -338)">
      <path d="M1038 257h76l24 24v137h-100zM1114 257v24h24" class="ink"/>
      <text x="1088" y="320" text-anchor="middle" class="label">RECEIPT</text>
      <path d="M1055 342h63M1055 359h46M1055 376h27" class="ink"/>
      <!-- Neutral wax seal: no approval tick. -->
      <path d="M1094 386l7-6 8 2 7-2 7 6 2 8 5 6-3 8 1 8-7 5-4 8-9-1-7 4-7-6-8-2-3-8-5-6 3-8-1-8z" class="accent"/>
      <circle cx="1108" cy="404" r="14" fill="#a23e22"/>
    </g>

    <!-- STORE: database icon is 40x56 -> 30x42. -->
    <g data-icon="store" transform="translate(1023 511) scale(.75) translate(-1023 -511)">
      <path d="M1003 494c0-7 9-11 20-11s20 4 20 11v34c0 7-9 11-20 11s-20-4-20-11z" class="ink"/>
      <path d="M1003 494c0 7 9 11 20 11s20-4 20-11M1003 511c0 7 9 11 20 11s20-4 20-11" class="ink"/>
    </g>
    <text x="1055" y="503" class="label">STORE</text>
    <text x="1055" y="525" class="tiny">~/.local/share/seal</text>
    <path d="M1086 419v47h-52" class="ink" marker-end="url(#arrow-ink)"/>

    <!-- REPLAY: dashed curve above, label clear below. -->
    <path d="M1040 420c-8 29-25 43-62 43H626c-38 0-57-18-57-54" class="accent" stroke-dasharray="9 8" marker-end="url(#arrow-accent)"/>
    <path d="M779 449l28 28M807 449l-28 28" class="accent"/>
    <text x="793" y="535" text-anchor="middle" class="label accent-text">REPLAY REFUSED</text>
  </g>

  <!-- FORWARDED gap -->
  <text x="1249" y="234" text-anchor="middle" class="h2">FORWARDED</text>
  <text x="1249" y="261" text-anchor="middle" class="small">Seal does not</text>
  <text x="1249" y="280" text-anchor="middle" class="small">run the call,</text>
  <text x="1249" y="299" text-anchor="middle" class="small">it lets it</text>
  <text x="1249" y="315" text-anchor="middle" class="small">through</text>
  <path d="M1177 331h142" class="accent" marker-end="url(#arrow-accent)"/>

  <!-- MCP SERVER -->
  <g aria-label="Protected MCP server with one guarded and two not-approval-gated tools">
    <rect data-padding="16" x="1310" y="112" width="235" height="482" rx="8" class="ink"/>
    <text x="1428" y="166" text-anchor="middle" class="h2">MCP SERVER</text>

    <rect data-padding="16" x="1330" y="180" width="195" height="55" fill="#a23e22"/>
    <text x="1428" y="214" text-anchor="middle" class="label" fill="#f7f1e5" style="fill:#f7f1e5">demo.mutate</text>
    <text x="1428" y="251" text-anchor="middle" class="small accent-text">GUARDED.</text>
    <text x="1428" y="271" text-anchor="middle" class="small accent-text">arrives only</text>
    <text x="1428" y="291" text-anchor="middle" class="small accent-text">through Seal</text>

    <rect data-padding="16" x="1330" y="306" width="195" height="61" fill="#66645f" fill-opacity="0.12"/>
    <text x="1428" y="343" text-anchor="middle" class="label">db.read</text>
    <text x="1428" y="384" text-anchor="middle" class="small">NOT APPROVAL-GATED.</text>
    <text x="1428" y="404" text-anchor="middle" class="small">passes through Seal</text>

    <rect data-padding="16" x="1330" y="424" width="195" height="62" fill="#66645f" fill-opacity="0.12"/>
    <text x="1428" y="462" text-anchor="middle" class="label">fs.list</text>
    <text x="1428" y="504" text-anchor="middle" class="small">NOT APPROVAL-GATED.</text>
    <text x="1428" y="524" text-anchor="middle" class="small">passes through Seal</text>
  </g>

  <!-- Real effect: only the accent route reaches it. -->
  <path d="M1512 208h66v84h52" class="accent" marker-end="url(#arrow-accent)"/>
  <g aria-label="The real effect happens once outside Seal">
    <g data-icon="real-effect" transform="translate(1669 300) scale(.75) translate(-1669 -300)">
      <path d="M1637 274c0-8 14-13 32-13s32 5 32 13v51c0 8-14 13-32 13s-32-5-32-13z" class="ink"/>
      <path d="M1637 274c0 8 14 13 32 13s32-5 32-13M1637 300c0 8 14 13 32 13s32-5 32-13" class="ink"/>
    </g>
    <text x="1717" y="309" class="label accent-text">1</text>
    <text x="1669" y="382" text-anchor="middle" class="h2">THE REAL EFFECT</text>
    <text x="1669" y="411" text-anchor="middle" class="body">the resource</text>
    <text x="1669" y="432" text-anchor="middle" class="body">changes, once.</text>
    <text x="1669" y="453" text-anchor="middle" class="body">outside Seal</text>
  </g>

  <!-- Other protected-server calls bypass approval, not Seal. The 40px corridor exceeds the 16px clearance invariant. -->
  <path data-clearance="16" d="M186 368c27 0 35 12 35 39v138c0 27 12 40 39 40h241" class="muted" marker-end="url(#arrow-muted)"/>
  <path data-clearance="16" d="M510 585h690c17 0 25-8 25-25V336h65" class="muted" marker-end="url(#arrow-muted)"/>
  <path data-clearance="16" d="M186 392c17 0 23 12 23 39v144c0 27 12 40 39 40h253" class="muted" marker-end="url(#arrow-muted)"/>
  <path data-clearance="16" d="M510 615h715c17 0 25-8 25-25V455h40" class="muted" marker-end="url(#arrow-muted)"/>

  <!-- Receipt checking below Seal. -->
  <path d="M970 646v63c0 15-7 24-22 24h-75v16" class="ink" marker-end="url(#arrow-ink)"/>
  <g aria-label="seal verify local re-derivation">
    <rect data-padding="16" x="778" y="749" width="190" height="130" rx="6" class="ink"/>
    <path d="M798 779h150" class="ink"/>
    <g data-icon="verify-terminal" transform="translate(852 720) scale(.75) translate(-852 -720) translate(0 50)">
      <circle cx="834" cy="692" r="2" class="ink"/>
      <circle cx="844" cy="692" r="2" class="ink"/>
      <circle cx="854" cy="692" r="2" class="ink"/>
      <path d="M846 723l13 12-13 12M867 748h17" class="ink"/>
    </g>
    <text x="873" y="805" text-anchor="middle" class="label">seal verify</text>
    <text x="873" y="834" text-anchor="middle" class="small">local re-derivation</text>
  </g>

  <path d="M1068 646v63c0 15 7 24 22 24h49v16" class="ink" marker-end="url(#arrow-ink)"/>
  <g aria-label="seal-check browser paste a receipt">
    <rect data-padding="16" x="1048" y="749" width="190" height="130" rx="6" class="ink"/>
    <path d="M1068 779h150" class="ink"/>
    <g data-icon="check-browser" transform="translate(1142 720) scale(.75) translate(-1142 -720) translate(0 50)">
      <circle cx="1103" cy="692" r="2" class="ink"/>
      <circle cx="1113" cy="692" r="2" class="ink"/>
      <circle cx="1123" cy="692" r="2" class="ink"/>
      <circle cx="1142" cy="736" r="22" class="ink"/>
      <path d="M1120 736h44M1142 714c10 12 10 32 0 44M1142 714c-10 12-10 32 0 44" class="ink"/>
    </g>
    <text x="1143" y="805" text-anchor="middle" class="label">seal-check</text>
    <text x="1143" y="829" text-anchor="middle" class="small">browser.</text>
    <text x="1143" y="849" text-anchor="middle" class="small">paste a receipt</text>
  </g>

  <!-- Legend -->
  <g aria-label="Path legend">
    <path d="M42 800h75" class="accent" marker-end="url(#arrow-accent)"/>
    <text x="136" y="809" class="label">PROTECTED PATH</text>
    <text x="295" y="809" class="small">(through Seal)</text>
    <path d="M42 858h75" class="muted" marker-end="url(#arrow-muted)"/>
    <text x="136" y="867" class="label">NOT APPROVAL-GATED</text>
    <text x="335" y="867" class="small">(through Seal)</text>
  </g>
</svg>
